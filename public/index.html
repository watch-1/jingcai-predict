<!doctype html>
<html lang="zh-CN" data-boot="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<style id="critical-chrome">
html,body{background:#F7F7F8;margin:0}
html[data-boot="1"] #app.app{min-height:100vh;background:#F7F7F8}
.boot-shell{position:fixed;inset:0;z-index:10000;background:#F7F7F8;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
.boot-brand{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;height:40px;margin:0;padding:0}
.boot-brand-icon{width:40px;height:40px;border-radius:11px;object-fit:cover;display:block;flex:none}
.boot-brand-name{font:700 22px/40px sans-serif;letter-spacing:.02em;color:#1A1A1A;height:40px;white-space:nowrap;font-synthesis:none}
</style>
<script>
try {
  var t = 'luxury';
  try { t = JSON.parse(localStorage.getItem('jc_home_theme') || '"luxury"'); } catch (e) {}
  if (t !== 'pitch') t = 'luxury';
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'pitch' ? '#0B1220' : '#ffffff');
} catch (e) {}
</script>
<meta name="format-detection" content="telephone=no">
<title>云球迷 · 赛事资讯与赔率概率</title>
<meta name="description" content="竞彩足球赛程、赔率隐含概率与预测分析、开奖结果。仅供参考">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="icons/icon-192.png" as="image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="云球迷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<link rel="prefetch" href="data-center-boot.json" as="fetch" crossorigin="anonymous">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="boot-shell" class="boot-shell" aria-hidden="true">
  <div class="boot-brand">
    <img class="boot-brand-icon" src="icons/icon-192.png" width="40" height="40" alt="" decoding="sync" fetchpriority="high">
    <span class="boot-brand-name">云球迷</span>
  </div>
</div>
<div id="app" class="app">
  <div id="ptr" class="ptr"><i class="ptr-spin"></i><span>下拉刷新</span></div>
  <header id="top-chrome" class="top-chrome hidden" aria-label="主导航"></header>
  <div id="view" class="view"></div>
  <div id="planbar" class="planbar hidden"></div>
  <div id="calcbar" class="calcbar hidden" aria-label="串关试算"></div>
  <nav id="tabbar" class="tabbar"></nav>
</div>
<div id="me-drawer-mask" class="me-drawer-mask hidden" aria-hidden="true"></div>
<aside id="me-drawer" class="me-drawer" aria-hidden="true" aria-label="我的"></aside>
<div id="sheet" class="sheet-mask hidden"></div>
<div id="dialog" class="dialog-mask hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
(function () {
  try {
    if (/JingcaiPredictApp/i.test(navigator.userAgent)) {
      var cur = getComputedStyle(document.documentElement).getPropertyValue('--sat').trim();
      if (!cur || cur === '0px') document.documentElement.style.setProperty('--sat', '24px');
      document.documentElement.setAttribute('data-edge', '1');
      if (window.JingcaiChrome && window.JingcaiChrome.refreshSafeArea) window.JingcaiChrome.refreshSafeArea();
    }
  } catch (e) {}
})();
</script>
<script src="config.js"></script>
<script src="data-center-boot-slices.js"></script>
<script src="sample-data.js"></script>
<script src="js/kb-canvas.js"></script>
<script src="app.js"></script>
<script src="js/tribe-feed.js"></script>
<script type="module">
(async () => {
  try {
    await import('./js/float-ball.js?v=1.9.151');
    try {
      const raw = (location.hash || '#/home').replace(/^#\/?/, '');
      const name = (raw.split('?')[0].split('/')[0]) || 'home';
      if (window.JCFloatBall) window.JCFloatBall.syncRoute(name);
    } catch (_) {}
  } catch (err) {
    console.error('[float-ball] module failed; using CSS fallback', err);
    window.__floatBallModuleError = String(err && err.message || err);
    try {
      if (window.JCFloatBallFallback) window.JCFloatBallFallback.mount();
    } catch (_) {}
  }
})();
</script>
<script src="js/float-ball-fallback.js?v=1.9.151"></script>
</body>
</html>
