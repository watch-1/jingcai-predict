<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>403 头图投放 / 闪电预览</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { margin: 0; background: #1a1d24; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
  .row { display: flex; gap: 24px; padding: 20px; align-items: flex-start; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lab { color: #e8edf5; font-size: 13px; font-weight: 600; }
  .phone {
    width: 390px;
    background: #f6f7f9;
    overflow: hidden;
    border-radius: 0;
  }
  .prev-tabs {
    display: flex; gap: 0; overflow: hidden;
    background: #fff; border-bottom: 1px solid #ececef;
    font-size: 13px; color: #6b7280; font-weight: 600;
  }
  .prev-tabs span { flex: 1; text-align: center; padding: 11px 0; }
  .prev-tabs span.on { color: #1a1d24; box-shadow: inset 0 -2px 0 #5b7cfa; }
  .fake-pane { padding: 16px 14px 24px; color: #3b4048; font-size: 13px; background: #fff; min-height: 120px; }
  .hero.hero--edge { padding-top: 4px; }
  .nav-fake {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px 0; color: #fff; font-size: 13px; font-weight: 650;
  }
  .nav-fake .lg { display: inline-flex; align-items: center; gap: 6px; }
  .nav-fake .fav { padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 12px; font-weight: 600; }
  .crest {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff;
  }
  .wx-pair { display: flex; gap: 16px; }
  .wx-card { width: 390px; background: #070a12; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script src="/js/pitch-live.js?v=pitch403"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const view = q.get('view') || 'hero-on';

  const btn = (on) =>
    '<button type="button" class="hero-anim-live' + (on ? ' is-on' : '') + '" aria-label="动画直播">' +
    '<svg class="hero-anim-live-ico" viewBox="0 0 24 18" aria-hidden="true"><rect x="1.25" y="1.25" width="21.5" height="15.5" rx="3.2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="1.25" x2="12" y2="16.75" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="3.15" fill="none" stroke="currentColor" stroke-width="2"/></svg>动画直播</button>';

  const heroInner = (opts) => {
    const on = !!opts.on;
    const wx = opts.wx || 'sunny';
    return (
      '<div class="hero hero--edge hero--weather' + (on ? ' hero--anim-live' : '') + '" data-weather="' + wx + '" style="background:#0A0B0E">' +
        '<div class="hero-wx" aria-hidden="true"><div class="hero-wx-base"></div><div class="hero-wx-glow"></div><div class="hero-wx-sky"></div><div class="hero-wx-fx hero-wx-rain"></div><div class="hero-wx-fx hero-wx-flash"></div><div class="hero-wx-scrim"></div></div>' +
        '<div class="nav-fake"><span>‹</span><span class="lg">日职</span><span class="fav">关注</span></div>' +
        (on ? '<div class="hero-anim-stage is-on" id="stage"><div class="pitch-live" id="pitch"></div></div>' : '') +
        '<div class="teams">' +
          '<div class="tm"><div class="crest" style="background:#1166bb">柏</div><span>柏太阳神</span><small>主队</small></div>' +
          '<div class="mid"><div class="vs">VS</div><small>18:00 开赛</small>' + btn(on) + '</div>' +
          '<div class="tm"><div class="crest" style="background:#f2a100">千</div><span>千叶市原</span><small>客队</small></div>' +
        '</div>' +
      '</div>' +
      '<div class="prev-tabs"><span>态度</span><span>情报</span><span>赔率</span><span class="on">预测</span><span>实时</span><span>阵容</span></div>' +
      '<div class="fake-pane">仍停留在当前页，不跳转到实时、也不弹出全屏。</div>'
    );
  };

  function mountPitch(el, weather, flash) {
    if (!el || !window.JCPitchLive) return;
    window.JCPitchLive.mount(el, {
      weather: weather,
      homeName: '柏太阳神',
      awayName: '千叶市原',
      tabVisible: true,
      pack: { coords: [], hasCoords: false, live: false, finished: false, phase: 'NS', phaseZh: '未开赛', kickoffMs: Date.now() + 3600e3 },
      state: { phase: 'NS', phaseZh: '未开赛', finished: false, live: false, kickoffMs: Date.now() + 3600e3 },
    });
    if (flash) {
      const wrap = el.querySelector('.pitch-live-wrap');
      if (wrap) wrap.classList.add('is-flashing');
      const inst = window.JCPitchLive.get(el);
      if (inst && inst.paintSkyFlash) inst.paintSkyFlash({ preview: true });
    }
  }

  const row = document.getElementById('row');
  if (view === 'hero-off' || view === 'hero-on') {
    const on = view === 'hero-on';
    row.innerHTML = '<div class="col"><div class="lab">' + (on ? '点「动画直播」后：头图投放' : '未点击：头图保留，不自动弹出') + '</div><div class="phone" id="phone">' + heroInner({ on: on, wx: 'sunny' }) + '</div></div>';
    if (on) mountPitch(document.getElementById('pitch'), 'sunny', false);
  } else if (view === 'wx') {
    row.innerHTML =
      '<div class="col"><div class="lab">晴天：不会突然暗下去</div><div class="phone wx-card"><div class="pitch-live" id="p-sun"></div></div></div>' +
      '<div class="col"><div class="lab">雷雨平常</div><div class="phone wx-card"><div class="pitch-live" id="p-storm"></div></div></div>' +
      '<div class="col"><div class="lab">远处闪电时，场馆一起亮一下</div><div class="phone wx-card"><div class="pitch-live" id="p-flash"></div></div></div>';
    mountPitch(document.getElementById('p-sun'), 'sunny', false);
    mountPitch(document.getElementById('p-storm'), 'storm', false);
    mountPitch(document.getElementById('p-flash'), 'storm', true);
  }
  document.documentElement.setAttribute('data-preview-ready', '1');
})();
</script>
</body>
</html>
