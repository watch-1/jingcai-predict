<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2C3C"/>
      <stop offset="1" stop-color="#121A26"/>
    </linearGradient>
    <radialGradient id="teal" cx="46%" cy="38%" r="64%">
      <stop offset="0" stop-color="#2AA392"/>
      <stop offset="0.48" stop-color="#1A7A70"/>
      <stop offset="1" stop-color="#0C534C"/>
    </radialGradient>
    <radialGradient id="ballLit" cx="34%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1F2F4"/>
      <stop offset="1" stop-color="#C5CAD0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E4A8"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6414"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="1" stop-color="#F8E7B0"/>
    </linearGradient>
    <filter id="cloudShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#071614" flood-opacity="0.30"/>
    </filter>
    <clipPath id="ballClip">
      <circle cx="512" cy="430" r="162"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#navy)"/>
  <circle cx="512" cy="512" r="400" fill="url(#teal)"/>
  <circle cx="470" cy="450" r="240" fill="#3EC4B0" opacity="0.11"/>

  <g filter="url(#cloudShadow)" fill="#FFFFFF" stroke="none">
    <path d="M 316.2 338.7 A 216 216 0 1 0 715.0 356.1" fill="none" stroke="#FFFFFF" stroke-width="108" stroke-linecap="round"/>
    <!-- organic puffs along the wrap, kept tight to the ball -->
    <ellipse cx="328" cy="510" rx="78" ry="62"/>
    <ellipse cx="400" cy="585" rx="72" ry="52"/>
    <ellipse cx="512" cy="605" rx="128" ry="72"/>
    <ellipse cx="632" cy="575" rx="76" ry="56"/>
    <ellipse cx="692" cy="470" rx="70" ry="64"/>
    <ellipse cx="668" cy="405" rx="52" ry="44"/>
    <ellipse cx="300" cy="455" rx="58" ry="48"/>
  </g>
  <ellipse cx="360" cy="478" rx="44" ry="20" fill="#fff" opacity="0.65"/>
  <ellipse cx="668" cy="410" rx="36" ry="16" fill="#fff" opacity="0.65"/>

  <path d="M 297.4 580.3 A 262 262 0 0 0 726.6 580.3" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 297.4 580.3 A 262 262 0 0 0 726.6 580.3" fill="none" stroke="url(#goldHi)" stroke-width="8" stroke-linecap="round" opacity="0.65"/>

  <circle cx="512" cy="436" r="168" fill="#0E2A28" opacity="0.16"/>
  <circle cx="512" cy="430" r="162" fill="url(#ballLit)"/>
  <g clip-path="url(#ballClip)">
    <polygon points="512.0,374.9 564.4,413.0 544.4,474.6 479.6,474.6 459.6,413.0" fill="#1B1D20"/>
    <polygon points="512.0,323.1 481.2,300.7 493.0,264.5 531.0,264.5 542.8,300.7" fill="#1B1D20"/>
    <polygon points="613.7,397.0 625.5,360.7 663.5,360.7 675.3,397.0 644.5,419.3" fill="#1B1D20"/>
    <polygon points="574.8,516.5 612.9,516.5 624.7,552.7 593.9,575.1 563.1,552.7" fill="#1B1D20"/>
    <polygon points="449.2,516.5 460.9,552.7 430.1,575.1 399.3,552.7 411.1,516.5" fill="#1B1D20"/>
    <polygon points="410.3,397.0 379.5,419.3 348.7,397.0 360.5,360.7 398.5,360.7" fill="#1B1D20"/>
  </g>
  <circle cx="512" cy="430" r="162" fill="none" stroke="#E4E7EB" stroke-width="5" opacity="0.45"/>
  <ellipse cx="466" cy="376" rx="40" ry="22" fill="#fff" opacity="0.26"/>
